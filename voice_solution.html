<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gram Sanjivani - Voice Solution</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        /* Google Translate Script */
        iframe.goog-te-banner-frame,
        .goog-te-banner-frame {
            display: none !important;
            visibility: hidden !important;
        }

        body {
            top: 0px !important;
            position: static !important;
        }

        html {
            top: 0px !important;
        }

        .goog-logo-link {
            display: none !important;
        }

        .goog-te-gadget {
            color: transparent !important;
            font-size: 0px !important;
        }

        #goog-gt-tt,
        .goog-tooltip,
        .goog-tooltip skiptranslate,
        .skiptranslate.goog-te-banner-frame {
            display: none !important;
            visibility: hidden !important;
        }

        .goog-te-gadget {
            color: transparent !important;
        }

        #goog-gt-tt {
            display: none !important;
        }

        .goog-tooltip skiptranslate {
            display: none !important;
        }

        :root {
            --primary-color: #d4af37;
            --background-color: #000000;
            --surface-color: #1a1a1a;
            --text-color: #e0e0e0;
            --gold-gradient: linear-gradient(45deg, #d4af37, #f9e29c);
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }

        /* Header Styles */
        header {
            background: rgba(0, 0, 0, 0.9);
            padding: 3rem 0 1rem 0;
            border-bottom: 1px solid var(--primary-color);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        header.scrolled {
            background: rgba(0, 0, 0, 1);
            padding: 2.5rem 0 0.5rem 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .logo:hover {
            transform: scale(1.05);
            text-shadow: 0 0 10px var(--primary-color);
        }

        .nav-links {
            display: flex;
            list-style: none;
            align-items: center;
        }

        .nav-links li {
            margin-left: 30px;
        }

        .nav-links a,
        .lang-btn {
            text-decoration: none;
            color: var(--white);
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            position: relative;
            background: none;
            border: none;
            cursor: pointer;
        }

        .lang-btn {
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .lang-btn:hover {
            background: var(--primary-color);
            color: #000;
        }

        .hamburger {
            display: none;
            color: var(--white);
            font-size: 1.5rem;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .hamburger {
                display: block;
            }

            .container {
                width: 90%;
            }

            .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: rgba(0, 0, 0, 0.95);
                padding: 1rem 0;
            }

            .nav-links.active {
                display: flex;
            }

            .nav-links li {
                margin: 15px 0;
                text-align: center;
            }
        }

        .content-area {
            flex: 1;
            padding: 2rem;
            max-width: 1000px;
            margin: auto;
            margin-top: 100px;
            width: 100%;
        }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        .action-btn,
        .primary-gold-btn {
            background-color: var(--surface-color);
            border: 1px solid #333;
            color: var(--primary-color);
            padding: 1rem;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .primary-gold-btn {
            background: var(--gold-gradient);
            color: #000;
            border: none;
            display: flex;
            align-items: center;
            flex-direction: row;
        }

        .action-btn:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.2);
        }

        .action-btn i {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .profile-card {
            background: var(--surface-color);
            border: 1px solid #333;
            padding: 2rem;
            border-radius: 15px;
            margin-top: 2rem;
            width: 100%;
            box-sizing: border-box;
        }

        video {
            width: 100%;
            max-width: 100%;
            border-radius: 15px;
            border: 2px solid var(--primary-color);
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <!-- Google Translate Script -->
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'en', includedLanguages: 'hi,gu,en', autoDisplay: false }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript"
        src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <!-- Google Translate Override Script -->
    <script>
        const removeGoogleTranslateBanner = () => {
            const elements = document.querySelectorAll('.goog-te-banner-frame, iframe.goog-te-banner-frame');
            elements.forEach(el => {
                el.style.display = 'none';
                el.style.visibility = 'hidden';
            });
            document.body.style.top = '0px';
            document.documentElement.style.top = '0px';
        };

        document.addEventListener('DOMContentLoaded', () => {
            removeGoogleTranslateBanner();
            const observer = new MutationObserver(removeGoogleTranslateBanner);
            observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['style'] });
            observer.observe(document.documentElement, { attributes: true, attributeFilter: ['style'] });
        });
    </script>

    <header>
        <nav class="container">
            <a href="index.html" class="logo notranslate">Gram Sanjivani</a>
            <i class="fas fa-bars hamburger" id="hamburgerMenu"></i>
            <ul class="nav-links" id="navLinks">
                <li><button id="request-perms" class="primary-gold-btn">Enable Sensors</button></li>
                <li><a href="index.html" data-en="Home" data-hi="मुख्य पृष्ठ" data-gu="મુખ્ય પૃષ્ઠ">Home</a></li>
                <li><button id="langToggle" class="lang-btn">हिंदी</button></li>
            </ul>
        </nav>
    </header>

    <div id="main-content" class="content-area">
        <h2 style="color: var(--primary-color); text-align: center;">Smart Health Assistant</h2>

        <div class="action-grid">
            <button id="btn-camera" class="action-btn">
                <i class="fas fa-camera"></i>
                <span>Open Camera</span>
            </button>
            <button id="btn-upload" class="action-btn">
                <i class="fas fa-file-upload"></i>
                <span>Upload Image</span>
            </button>
            <button id="btn-voice" class="action-btn" style="border: 2px solid var(--primary-color);">
                <i class="fas fa-microphone"></i>
                <span>Voice Chat</span>
            </button>
        </div>

        <input type="file" id="file-input" hidden accept="image/*">

        <div id="camera-section" class="hidden">
            <video id="camera-preview" autoplay playsinline></video>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-switch-camera" class="action-btn"
                    style="padding: 10px; flex: 1; min-width: auto; font-size: 1rem;"><i class="fas fa-sync-alt"
                        style="font-size: 1.5rem;"></i><span>Switch Camera</span></button>
                <button id="btn-capture" class="primary-gold-btn" style="flex: 2;">Capture & Analyze</button>
            </div>
            <canvas id="photo-canvas" class="hidden"></canvas>
        </div>

        <div id="analysis-result" class="profile-card hidden">
            <h3 id="res-issue" style="color: var(--primary-color);"></h3>
            <p id="res-remedy"></p>
            <p id="res-ointment"></p>
            <p id="res-warning" style="color: #ff4444; font-weight: bold;"></p>
        </div>
    </div>

    <script type="module" src="app.js?v=2"></script>
    <script>
        // Auto Translate logic
        let currentLang = localStorage.getItem('preferredLang') || 'en';
        window.addEventListener('load', () => {
            setTimeout(() => {
                const logos = document.querySelectorAll('.logo');
                logos.forEach(logo => {
                    if (currentLang === 'hi') logo.innerText = 'ग्राम संजीवनी';
                    else if (currentLang === 'gu') logo.innerText = 'ગ્રામ સંજીવની';
                    else logo.innerText = 'Gram Sanjivani';
                });

                if (currentLang !== 'en') {
                    const select = document.querySelector('.goog-te-combo');
                    if (select) {
                        select.value = currentLang;
                        select.dispatchEvent(new Event('change'));
                    }
                }
            }, 1000); // Allow widget to load
        });

        // Hamburger Menu Logic
        const hamburger = document.getElementById('hamburgerMenu');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }

        // Sticky Header Logic
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // Language Toggle Logic Port for Top Nav
        const langToggle = document.getElementById('langToggle');
        if (langToggle) {
            langToggle.innerText = getLangName(localStorage.getItem('preferredLang') || 'en');
        }

        function getLangName(langCode) {
            if (langCode === 'hi') return 'हिंदी';
            if (langCode === 'gu') return 'ગુજરાતી';
            return 'English';
        }

        if (langToggle) {
            langToggle.addEventListener('click', () => {
                let l = localStorage.getItem('preferredLang') || 'en';
                let nextLang = 'en';
                if (l === 'en') nextLang = 'hi';
                else if (l === 'hi') nextLang = 'gu';

                localStorage.setItem('preferredLang', nextLang);
                window.location.reload();
            });
        }
    </script>
</body>

</html>
